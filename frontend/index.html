    <style>
      /* ── Scroll-triggered section animations ── */
      .reveal {
        opacity: 0;
        transform: translateY(32px);
        transition: opacity 0.65s cubic-bezier(.4,0,.2,1), transform 0.65s cubic-bezier(.4,0,.2,1);
      }
      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .reveal-left {
        opacity: 0;
        transform: translateX(-32px);
        transition: opacity 0.65s cubic-bezier(.4,0,.2,1), transform 0.65s cubic-bezier(.4,0,.2,1);
      }
      .reveal-left.visible {
        opacity: 1;
        transform: translateX(0);
      }
      .reveal-right {
        opacity: 0;
        transform: translateX(32px);
        transition: opacity 0.65s cubic-bezier(.4,0,.2,1), transform 0.65s cubic-bezier(.4,0,.2,1);
      }
      .reveal-right.visible {
        opacity: 1;
        transform: translateX(0);
      }
      /* ── Header transparent → solid transition ── */
      #site-header {
        transition: background-color 0.35s cubic-bezier(.4,0,.2,1),
                    box-shadow 0.35s cubic-bezier(.4,0,.2,1),
                    padding 0.3s ease;
      }
      /* ── Gold underline decoration ── */
      .gold-underline {
        position: relative;
        display: inline-block;
      }
      .gold-underline::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 0;
        width: 48px;
        height: 3px;
        background: #DB9F00;
        border-radius: 9999px;
      }
      /* ── Card hover lift ── */
      .card-lift {
        transition: transform 0.3s cubic-bezier(.4,0,.2,1), box-shadow 0.3s cubic-bezier(.4,0,.2,1);
      }
      .card-lift:hover {

      /* ── Gradient text ── */
      .text-gradient {
        background: linear-gradient(135deg, #0830BC 0%, #397DE8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

      /* ── Line clamp ── */
      .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  <script>
    (function () {
      if (window.location.hash && window.location.hash.indexOf('#/') === 0) {
        var route = window.location.hash.slice(1);
        window.history.replaceState(null, '', route);
      }
    })();
  </script>
  <script>
    // Intersection Observer for reveal animations
    (function () {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.12 });

      function observeAll () {
        document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(function (el) {
          observer.observe(el);
        });
      }

      // Run after React mounts (small delay to let React render)
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { setTimeout(observeAll, 300); });
      } else {
        setTimeout(observeAll, 300);
      }

      // Re-observe on route changes (SPA navigation)
      var lastHref = location.href;
      setInterval(function () {
        if (location.href !== lastHref) {
          lastHref = location.href;
          setTimeout(observeAll, 400);
        }
      }, 400);
    })();
  </script>
